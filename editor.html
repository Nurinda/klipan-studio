<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor — Klipan Studio</title><link rel="icon" href="logo.webp"><link rel="stylesheet" href="style.css"></head><body class="ed">
<header><a href="index.html"><img class="lg" src="logo.webp" alt="kumparan"></a><b class="logo" style="font-size:17px">Klipan Studio</b><span class="tag">Edit video langsung di browser</span><div><select id="ratio"><option>9:16</option><option>1:1</option><option>16:9</option><option>4:5</option></select> <select id="res"><option value="480">480p</option><option value="720" selected>720p</option><option value="1080">1080p</option></select> <button id="exp" class="go">Ekspor</button></div></header>
<main><aside><h3>Media</h3><label class="btn go">+ Impor file<input id="file" type="file" accept="video/*,audio/*,image/*" multiple hidden></label><div id="bin"></div>
<h3>Stiker</h3><div id="stk"></div><h3>Efek suara</h3><div id="sfx"></div><h3>Musik latar</h3><div id="mus"></div><h3>Teks</h3><input id="txt" placeholder="Tulis teks..."><button id="addTxt">Tambah teks</button>
<h3>Auto-caption</h3><select id="lang"><option value="indonesian">Indonesia</option><option value="english">English</option></select><button id="cap" class="red">Buat caption</button><small id="capst">Pertama kali dipakai, model ±40MB diunduh dulu.</small><h3>Rekam</h3><button id="vo">🎙 Rekam suara</button><button id="scr">🖥 Rekam layar</button><h3>Caption (SRT)</h3><button id="srtx">Ekspor SRT</button><label class="btn">Impor SRT<input id="srti" type="file" accept=".srt" hidden></label><h3>Proyek</h3><button id="save">Simpan proyek</button><label class="btn">Buka proyek<input id="open" type="file" accept=".json" hidden></label></aside>
<section><canvas id="cv"></canvas><div><button id="play" class="go">▶ Putar</button> <span id="tm">0:00 / 0:00</span></div></section>
<aside><h3>Properti</h3><div id="props"></div></aside></main>
<footer><div class="tools"><button id="split">Split (S)</button><button id="del">Hapus (Del)</button><button id="dup">Duplikat</button><button id="undo">Undo</button><label style="flex-direction:row;align-items:center;gap:6px">Zoom timeline <input id="zoomTl" type="range" min="20" max="200" value="60"></label></div><div id="tl"><div id="ph"></div><div class="trk" id="trkV"></div><div class="trk" id="trkT"></div><div class="trk" id="trkO"></div><div class="trk" id="trkA"></div></div></footer>
<script type="module" src="app.js"></script></body></html>
